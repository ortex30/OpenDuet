# Skills this deployment ships, and the tools each one needs.
#
# A skill is a named instruction anybody here can invoke with `/`. It adds no capability: it can only
# ask a Bot to use what that Bot was already granted, and every one of those calls is still decided,
# policy-checked and recorded.
#
# `tools:` is the second thing a skill is for, and the reason this file exists rather than a screen.
# A Bot holding more than a handful of tools is offered, per run, only the tools of the skills that
# match the message, because a model picks the right tool reliably out of about ten and unreliably
# out of thirty. That matching needs skills to match against, and a deployment starts with none — so
# left to a screen, the narrowing is switched off on every clone until somebody maps tools to skills
# by hand, in each deployment, again after each new connector. Shipping the declaration with the
# skill is what makes connecting a connector the only step.
#
# NAMING A TOOL HERE GRANTS NOBODY ANYTHING. What a Bot may call is its grants, and the offer is
# always intersected with them: a skill naming a tool its Bot does not hold loads nothing. So this
# file may name tools for connectors this deployment has not added, and should — that is what makes
# them work the moment somebody does.
#
# Refs are `<serverId>/<toolName>`, the same form a grant is written in. `google-drive` and `notion`
# are catalogue connectors; a server an administrator adds by URL uses the id it was given.
skills:
  # OpenDuet's own two. The brief is a server tool (server/src/openduet/brief.ts) that every Bot
  # holds; it reads only the Gmail and Calendar tools the Bot was granted, so these tool refs are what
  # an administrator grants on /admin/plugins/google-workspace for the brief to have anything to read.
  - slug: morning-brief
    title: Morning brief
    summary: What's due, what needs you today, and today's classes, from your school mail and calendar.
    instructions: >-
      Call morning_brief. The app shows its result as a card, so do not list the items again. Then
      say, in at most two short sentences, the one assignment or test to work on first and why, and
      offer one concrete next step, such as starting it, a quick quiz for it, or replying to the
      teacher or counselor who is waiting. If the brief lists a source
      it could not check, say what is missing and that it can be connected on the Connections page;
      never describe a source it could not check as quiet.
    tools:
      - google-workspace/gmail_search_messages
      - google-workspace/calendar_list_events

  # Academic OS's study skills. They read the student's Classroom notices and calendar through the
  # same Gmail and Calendar grants as the brief, and the teacher's AI help level comes from the
  # notice itself (see the TEACHER RULES part of the Bot's prompt).
  - slug: work-on-now
    title: What should I work on now?
    summary: Pick the one assignment to start right now, why, and the first ten minutes of it.
    instructions: >-
      Search their mail for Google Classroom notices from the last week (from:classroom.google.com
      newer_than:7d) and read this week's calendar with calendar_list_events. Open a notice with
      gmail_read_message when the subject does not give the due date. Rank what is open by due date
      first, then points and how much work is left, and skip anything a later notice shows was
      returned or graded. Account for the time they have today before the next class, practice or
      event. Answer with the one assignment to start now, the reason in a short clause, its AI help
      level, and a first step they can do in ten minutes. Then call suggest_replies with chips such
      as "Start it", "Something else" and "Plan my week". If nothing is due, say so plainly and
      suggest studying for the nearest test. If mail is not connected, say so and where to connect it.
    tools:
      - google-workspace/gmail_search_messages
      - google-workspace/gmail_read_message
      - google-workspace/calendar_list_events

  - slug: plan-assignments
    title: Turn my assignments into tasks
    summary: Find every open assignment and test and put each on your task list with a due date and first step.
    instructions: >-
      Search their mail for Google Classroom notices from the last two weeks
      (from:classroom.google.com newer_than:14d) and read the next seven days of their calendar for
      tests and due dates. Read each notice that announces an assignment, a quiz, a test or missing
      work. Leave out anything already returned or graded, and merge a notice and a calendar entry
      that are the same thing. Call add_tasks once with one task for each, most urgent first, up to
      eight: the title is the class and the assignment, the why starts with the due date and the AI
      help level and then says what it is worth, the first step is concrete and takes about ten
      minutes, and the source is the Classroom link. Then say in one sentence how many you added
      and which one is most urgent. If you find none, say so and what you searched.
    tools:
      - google-workspace/gmail_search_messages
      - google-workspace/gmail_read_message
      - google-workspace/calendar_list_events

  - slug: quiz-me
    title: Quiz me
    summary: A short practice quiz on a class or an upcoming test, graded as you go.
    instructions: >-
      Work out what to quiz on: what they named, or else their nearest upcoming quiz or test from
      their calendar and Classroom notices, and read the notice for what it covers. Then call
      make_quiz once, with the class's exact name from the notice, the assignment when the quiz is
      for one, a title naming the topic, and five questions unless they ask for another number,
      mixing easy and hard, each with four plausible choices, the index of the right one, a
      one-sentence explanation and its topic. The card runs the quiz and grades it, so never write
      the questions, choices or answers in the chat; say one short sentence about the quiz. If
      make_quiz is refused because of a teacher's rule, say so in one sentence and offer to plan
      their time or quiz them on a different class. If it is refused for any other reason, fix what
      it says and call it again.
    tools:
      - google-workspace/gmail_search_messages
      - google-workspace/gmail_read_message
      - google-workspace/calendar_list_events

  - slug: flashcards
    title: Make flashcards
    summary: Turn a topic, a test's coverage or a vocab list into a deck of flashcards to study.
    instructions: >-
      Work out the topic: what they named, or else their nearest upcoming test from the calendar and
      its Classroom notice. Then call make_flashcards once with the class's exact name, the
      assignment when the deck is for one, a title naming the topic, and 12 to 20 cards, each one
      fact or term with a short front and a back of at most 20 words, ordered from basics to
      hardest. The card shows the deck, so never list the cards in the chat; say one sentence about
      the deck. If make_flashcards is refused because of a teacher's rule, say so in one sentence and
      offer to plan their time or help with a different class.
    tools:
      - google-workspace/gmail_search_messages
      - google-workspace/gmail_read_message
      - google-workspace/calendar_list_events

  - slug: plan-my-time
    title: Plan my study time
    summary: Fit your homework and test prep around your classes and practice, then add it to your calendar.
    instructions: >-
      Find out how much time they have and when they can start, from what they said; if they said
      neither, plan 120 minutes for today from now. Call propose_study_plan with those minutes, the
      start time, the number of days (1 for today or tonight, up to 7 for the week), startDay when
      it starts on a later day (tomorrow, or a weekday such as saturday; never a guessed date), the
      assignments to do first when they named any, and a one-sentence reason. The card shows the sessions with an
      Apply button, so never list them in the chat. Say in one sentence what the plan covers and
      what did not fit, and remind them that nothing is on their calendar screen until they press
      Apply. If it is refused, fix what it says and call it again.

  - slug: how-am-i-doing
    title: How am I doing?
    summary: Your practice quiz results by topic, and what to review next.
    instructions: >-
      Call show_progress, with the class when they named one. The card shows the numbers, so say in
      one or two short sentences which topic to review first and offer a quiz or flashcards on it.
      If they have not taken any quizzes yet, say so and offer a short quiz on their next test.

  - slug: explain
    title: Explain it simply
    summary: Explain a concept from class in plain words, with one example, then check you got it.
    instructions: >-
      Explain the concept they asked about the way a good tutor would to a high school student:
      start with the idea in one or two plain sentences, then one short example worked step by step,
      then one quick question that checks they understood. Keep it short enough to read on a phone,
      and use make_page only if they ask for notes to keep. If the concept is tied to an assignment,
      follow that assignment's AI help level: under Hints only explain the concept with a different
      example than the assignment's own problems, and under No help explain nothing about that
      assignment's questions. If you are not sure of a fact, say so instead of guessing.
    tools:
      - google-workspace/gmail_search_messages
      - google-workspace/gmail_read_message

  # On the first day Chat sends this request by itself, framed so the Bot does not greet them twice
  # (app/src/components/shell/first-day.tsx, shared/first-day.ts); the skill is what brings the mail
  # and calendar tools to that run, and its instructions apply when somebody picks it from the / menu.
  - slug: first-day
    title: Get to know you
    summary: Learn what you do from your recent mail and this week's calendar, and say how it can help.
    instructions: >-
      Read the person's recent mail with gmail_search_messages and this week's calendar with
      calendar_list_events, opening a message with gmail_read_message only when its subject is not
      enough. Then answer in three parts, with a blank line between them. First, who they are and
      what they do, in plain sentences with no bold or headings and at most 450 characters: their
      work, the people and companies they deal with most, and what is coming up, using only what
      the tools returned. Second, "How I'll help:" and three bullets, one line each and under 60
      characters, each tied to something you saw. Third, end with this sentence on its own: "If any
      of these sound off, just let me know and I'll learn." If mail or calendar is not connected, say
      which one and that it can be connected on the Connections page, and never guess at what you
      could not read.
    tools:
      - google-workspace/gmail_search_messages
      - google-workspace/gmail_read_message
      - google-workspace/calendar_list_events

  - slug: reply-to-an-email
    title: Reply to an email
    summary: Read a message and draft a reply that goes out only after you approve it.
    instructions: >-
      Find the message the person means, and if more than one could be it, pick the one that matches
      what they said rather than the newest. Read it whole with gmail_read_message before drafting
      anything. Write a short reply in the person's voice that answers what was asked and nothing
      more. Then call gmail_send_reply to the sender, in the same thread, straight away: do not ask
      the person to confirm the draft first. The send itself pauses and shows them the exact
      message with Refuse, Allow once and Always allow, which is where they decide; asking before it
      would ask twice. Never say a reply was sent until the tool says so, and if they refuse, say
      plainly that it was not sent.
    tools:
      - google-workspace/gmail_read_message
      - google-workspace/gmail_send_reply

  - slug: research-public-web
    title: Research the public web
    summary: Search current public sources and write a cited brief.
    instructions: >-
      Use the public-web research tools you hold to discover relevant sources and read selected
      pages before answering. Honor an explicit user choice of another authorized provider. Keep
      search objectives specific and queries concise. Send only the necessary research objective,
      queries and URLs; do not send whole conversations or private documents. Cite the source URLs
      and state missing evidence or provider errors. A missing grant requires an administrator;
      never work around a denial.
    tools:
      - "@research/search"
      - "@research/fetch"

  - slug: find-a-document
    title: Find a document
    summary: Search the connected document sources for a file and read what it says.
    instructions: >-
      Find the document the person is asking about before answering anything about its contents.
      Search first, then read the file you found rather than answering from its title. If the search
      returns nothing, say so and say what you searched for, rather than guessing at what the
      document might contain. Name the document you used.
    tools:
      - google-drive/search_files
      - google-drive/read_file_content
      - google-drive/get_file_metadata

  - slug: find-a-notion-page
    title: Find a Notion page
    summary: Search Notion for a page and read what it says.
    instructions: >-
      Find the Notion page the person is asking about before answering anything about its contents.
      Search first, then fetch the page you found rather than answering from its title. If the search
      returns nothing, say so and say what you searched for, rather than guessing at what the page
      might contain. Name the page you used.
    tools:
      - notion/notion-search
      - notion/notion-fetch

  - slug: whats-changed
    title: What changed recently
    summary: List recently changed documents and say who changed them and when.
    instructions: >-
      List what has changed recently in the sources you can reach, newest first. Give the document
      name, who last changed it and when, and keep it to the ones that actually moved in the period
      asked about. Do not summarise contents unless you are asked to; this is a list of what moved.
    tools:
      - google-drive/list_recent_files
      - google-drive/get_file_metadata

  - slug: who-owns-this
    title: Who owns this
    summary: Find who owns a document and when they last touched it.
    instructions: >-
      Identify the owner of the document being asked about, and say when it was last changed. Search
      for the document first if you were given a name rather than a link. If more than one document
      matches, say so and list them rather than picking one.
    tools:
      - google-drive/search_files
      - google-drive/get_file_metadata

  - slug: check-a-claim
    title: Check a claim against a source
    summary: Take a statement and check it against what the documents actually say.
    instructions: >-
      You are checking a claim, not answering a question. Find the source that would settle it, read
      it, and say one of three things: the source supports the claim, the source contradicts it, or
      the source does not address it. Quote the sentence you are relying on. Do not fill a gap in the
      source with your own knowledge — "the source does not say" is a complete answer.
    tools:
      - google-drive/search_files
      - google-drive/read_file_content

  # The skill that writes skills. Its instruction is the whole feature: `save_skill` and the three
  # reads beside it are offered to a Bot only while it holds this slug, so granting this is what turns
  # a coworker into one you can author with. See app/src/lib/copilot/skill-tools.tsx.
  #
  # Declares no tools, and should not. The authoring tools are the app's own rather than a connector's,
  # so they are not `serverId/toolName` refs and a declaration here would name nothing. Selection only
  # ever narrows MCP tools; these are offered whenever the grant is there.
  - slug: skill-creator
    title: Write a skill
    summary: Interview me about a skill I want, write it, and save it as a new `/` command.
    instructions: |-
      You are writing a skill: a named instruction anybody in this deployment can invoke with `/`.
      Interview first, write second, and save only what the person has agreed to.

      A skill here is four things and nothing else. A command, which is its slug and its identity. A
      title, for the menu. A one-line summary. And the instruction a Bot follows when somebody invokes
      it. It may also declare the tools it needs, which is a declaration rather than a grant: naming a
      tool cannot make it callable, and a skill naming a tool its Bot does not hold simply loads
      nothing. There are no files, no scripts, no attachments and no example folders. Anything that
      cannot be said in those fields does not belong in a skill, and saying so early is kinder than
      discovering it at the end.

      Work in this order.

      1. Find out what the skill is for, in the person's own words. What should the Bot do that it does
         not reliably do now? When would they reach for this rather than just asking? What should come
         back — a list, a verdict, a drafted message, a number? If they have asked for the same thing
         three times in different words, that repetition is the skill; say so.

      2. Interview until you could do the task yourself. Ask about the order of steps, what counts as
         done, what the answer must contain, and above all what should happen when a step turns up
         nothing — that is the case a weak skill leaves out and the case that actually occurs. Ask
         about the shape of the output if the output has a shape. Do not ask more than three questions
         in one message, and do not ask what you can infer.

      3. Look before you name. Call `list_skills`. A slug is an identity, so reusing one replaces that
         skill: if what they want already exists, improve that one instead of writing a near-duplicate,
         and if the name they want belongs to somebody else, pick another and tell them why. A slug is
         lower-case letters, numbers and hyphens, and reads as a command — `check-a-claim`, not
         `Check_A_Claim`.

      4. Write the instruction. Address the Bot, in the imperative, as directions for the run. Never
         describe the skill in the third person and never address the person invoking it.

      5. Declare the tools it needs, if it needs any. Call `list_skill_tools` for the refs; never
         invent one. Declare tools for a connector this Bot does not hold if the skill genuinely needs
         them — that is what makes the skill work the moment somebody grants them — but say plainly
         which of them are not connected yet, because until they are, the skill will run without them.
         Most skills are prose and need none.

      6. Rehearse it before you save it. Take one realistic request the person would actually type,
         and walk through what the instruction as written would have you do, step by step, out loud.
         This is the only test available before saving, and it is worth doing: it is where you find the
         step that assumes a tool you did not declare, the ambiguity that could go two ways, and the
         missing answer for the case where the search returns nothing. Fix what the rehearsal exposes
         and rehearse again if you changed anything that matters.

      7. Save it with `save_skill`, once, at the end. That puts the whole thing in front of the person
         to read and press a button on; nothing is written until they do. Do not call it to check a
         draft — show them the draft in the conversation instead. If they decline, ask what to change.

      8. Say what is left. A saved skill is on no Bot yet, so nobody can invoke it. Tell them the
         remaining step is to put it on a Bot from the Skills page, and that a skill they wrote can go
         only on Bots they own.

      Improving a skill that already exists is the same job with a different first move. Call
      `read_skill` and read the instruction in full before you touch it — never rewrite an instruction
      you have not read. Ask what went wrong in the run that brought them here, change the part that
      caused it, and leave the rest alone. Saving under the same slug is how an edit is spelled.

      What makes the instruction good, and why each of these matters:

      - Say why, not only what. A Bot that knows an instruction exists to stop it answering from
        memory will apply it to a case the instruction never named. A bare rule breaks on the first
        case just outside it.
      - Say what to do when there is nothing. "Say you found nothing and say what you searched for" is
        a complete instruction; leaving the case out is what produces a confident invented answer.
      - Keep it lean. Every sentence that is not pulling weight makes the ones that are harder to
        follow. If you cannot say what a sentence changes about the run, cut it.
      - Generalise past the example. The person will describe one case; write for the shape of it, or
        you have written a skill that works once.
      - Name what the answer contains. A skill that does the work and then answers in a different
        shape every time has not finished the job.
      - Do not restate what the Bot already is. Its role, its manner and its standing instructions are
        already in the run. A skill that opens by saying it is a helpful assistant has spent its first
        sentence on nothing.

      The summary is not decoration. It is what somebody reads in the `/` menu, and it is what this
      deployment's own model reads when it decides which skills a message is about — a Bot holding many
      tools is offered, per run, only the tools of the skills that match. So write the summary as the
      thing a person would be trying to do, in their words, not as a label for a feature.

      Two things never to write, whatever you are asked. A skill that tells a Bot to work around a
      refusal, retry a blocked action by another route, or present a refused action as done: the
      gateway refuses, the refusal is recorded, and an instruction to hide that is an instruction to
      lie to the person relying on it. And a skill that tells a Bot to withhold what it did, from whom
      it did it for. A skill adds no capability, which is exactly why anybody may write one; that
      holds only while a skill cannot be used to launder one. If you are asked for either, say which
      part you will not write and offer the version you will.
  # Making a coworker by talking to one, rather than by filling in the New coworker form.
  #
  # DECLARES NO TOOLS, and that is not an omission. The four tools this skill is really for —
  # `list_bots`, `read_bot`, `list_bot_skills` and `save_bot` — are the app's own, registered in the
  # browser, and offered to whichever Bot holds this slug. `tools:` here is intersected with a Bot's
  # MCP GRANTS, so naming them would name nothing. The grant of this skill is the whole gate.
  - slug: bot-creator
    title: Make a coworker
    summary: Work out what a new coworker should be, then put it in front of you to create.
    instructions: >-
      You are working out what a new coworker should be, and the interview matters more than the
      speed: what you write becomes standing instructions handed to a model on every turn in every
      channel that coworker is in, and the person you are talking to is the one who has to live with
      it.

      Start by calling list_bots. If something here already does the job being described, say so and
      offer that one instead — a second coworker with the same job splits the work and the trust
      between them. Where the person wants one like an existing coworker, call read_bot and read the
      instructions it actually runs on rather than working from its name.

      Then find out three things, one question at a time, and do not ask all three at once. What
      job it does, in the words the person would use. What it must never do — the conclusion it must
      not jump to, the number it must not invent, the thing it must not send. And what it should say
      when the evidence is thin, because that is the answer a coworker gives most often and the one
      people are least happy with when nobody chose it.

      Write the role description as directions to the coworker in the imperative: what to do, in what
      order, what to do when a step turns up nothing. Not a description of it in the third person,
      and never addressed to the person talking to it. Keep it under a thousand characters, which is
      the limit and is usually more than enough — a long instruction is not a careful one.

      Call list_bot_skills and offer only the skills that fit the job. Putting a skill on a coworker
      is the only capability that gets granted here: no connector, no tool and no address, and you
      cannot give it any of those. Say so rather than implying the coworker will arrive able to
      reach things. Whatever it needs is granted afterwards, on its profile, by somebody who may.

      Read the whole role description back and get agreement on it before calling save_bot, and call
      save_bot once, at the end. It is not a way to show a draft: it puts a card in front of the
      person and nothing is created unless they press the button.
    tools: []

  # Academic OS's learning skills. They share one study memory (server/src/openduet/study-memory.ts):
  # `record_study` saves how each topic went after any practice, and `study_memory` reads it back, so
  # review is spaced, mistakes are revisited and the Learn tab fills in. Both are held by every Bot,
  # like make_page, so they are not named under `tools:`. Each skill follows the assignment's teacher
  # AI help level, read from its Classroom notice (see the TEACHER RULES part of the Bot's prompt).
  - slug: review
    title: Review what's due
    summary: A short spaced-review session on the topics your study memory says are due today.
    instructions: >-
      Call study_memory with view "due". If nothing is due, say so in a few words and offer the
      weakest topic instead (study_memory view "weakest"); if the memory is empty, offer a quick quiz
      on their nearest test to start it. Otherwise review up to five due topics, most overdue first,
      mixing classes rather than doing one class in a row. For each topic ask one fresh question that
      makes them recall the idea, not recognize it: ask them to state, apply or explain it, and never
      reuse a question word for word. When a topic has an open mistake, aim the question straight at
      that misunderstanding. Ask one question at a time and wait. After each answer say right, partly
      or not quite in a few words and give the one-line reason. When they are done, call record_study
      once with one entry per topic reviewed (activity "review"), the misconception for anything
      missed, and fixed true for any open mistake they now got right. End with one short sentence:
      how many they got, and the one topic coming back soonest.
    tools:
      - google-workspace/gmail_search_messages

  - slug: my-mistakes
    title: Fix my mistakes
    summary: Go back over the misunderstandings from earlier practice and fix them for good.
    instructions: >-
      Call study_memory with view "mistakes". If there are none, say so in a few words and offer a
      review instead. Otherwise take the most recent open mistake first, up to three in a session.
      For each one: name the misunderstanding in plain words without blaming, explain the right idea
      in one or two sentences with a fresh example, then ask one question that would catch the same
      mistake again. If they get it right, ask a second, slightly harder one; if they get both right,
      it is fixed. If not, explain it another way, with a picture in words or an analogy, and try one
      more question. Then call record_study once with an entry per topic worked (activity "review"):
      fixed true where they got both right, and the misconception again where they did not. End in one
      sentence with how many are fixed.

  - slug: tutor
    title: Walk me through it
    summary: Step-by-step tutoring on a problem, one hint at a time, so you solve it yourself.
    instructions: >-
      Get the problem: what they typed or attached, or ask for it in one short question. Work out
      which assignment it belongs to and find that assignment's AI help level in their Classroom mail.
      No help: do not touch it; say so in a sentence and offer to tutor them on a similar practice
      problem you make up for the same skill. Hints only, and whenever you cannot tell: never solve any
      step of their problem; ask what they know and what the question wants, then give one hint or one
      guiding question at a time, and when they make a mistake point at where it is and ask what they
      notice, never fix it for them. Full help: still go one step at a time, asking them to try each
      step first; show a step only after they have tried twice, then have them do the next one. In
      every case, keep each message to one step, check their thinking before moving on, and when they
      reach the answer ask them to say in one sentence why it works. Then call record_study once for
      the skill the problem practiced (activity "tutor"): correct if they solved it with at most one
      hint, partly if they needed more, missed if you had to show most of it, with the misconception
      when one came up.
    tools:
      - google-workspace/gmail_search_messages
      - google-workspace/gmail_read_message

  - slug: teach-back
    title: Teach it back to me
    summary: Explain a topic in your own words and find out exactly which parts you really know.
    instructions: >-
      Pick the topic: what they named, or else their nearest test and its Classroom notice. Before they
      start, privately list the three to five key ideas a complete explanation must have, and do not
      show the list. Ask them to explain the topic to you as if you were a classmate who missed the
      class, by typing or with the mic, in their own words. When they finish, say which key ideas they
      got in plain words, then name the single most important missing or wrong idea and ask one
      question that leads them to it rather than telling them. Let them try once more. Then show a
      short scorecard as one line, such as "4 of 5 ideas: missing why the rate goes up with
      temperature." Call record_study once with one entry per key idea (activity "teach-back"):
      correct if they explained it, partly if it was vague, missed if absent or wrong, with the
      misconception for anything wrong. Teach-back on a test topic is studying and always allowed, but
      if the topic is the subject of an assignment set to No help, do not discuss that assignment's
      questions.
    tools:
      - google-workspace/gmail_search_messages
      - google-workspace/gmail_read_message
      - google-workspace/calendar_list_events

  - slug: check-my-work
    title: Check my work
    summary: Find the first place your solution goes wrong, without fixing it for you.
    instructions: >-
      Get their work: typed steps or an attached photo or file. Find which assignment it is for and
      that assignment's AI help level in their Classroom mail. No help: do not check, mark or comment on
      any of it; say plainly that the teacher set it to no AI help, and offer to make a similar practice
      problem to check instead. Otherwise read every step and find the first one that goes wrong.
      Say which step it is and what kind of error it is (a sign, a formula, a unit, a misread question,
      a reasoning gap), and ask them to look at that step again. Never write the corrected step or the
      final answer, and never redo the work, under any level. If every step is right, say so and name
      the one thing they did best. Then call record_study once for the skill the work practiced
      (activity "check-work"): correct if it was all right, partly if one slip, missed if the method
      was wrong, with the misconception when the error came from a misunderstanding rather than a slip.
    tools:
      - google-workspace/gmail_search_messages
      - google-workspace/gmail_read_message

  - slug: writing-feedback
    title: Feedback on my writing
    summary: Rubric-style feedback on an essay or lab report draft, with your three biggest fixes.
    instructions: >-
      Get the draft: pasted or attached. Find the assignment and its AI help level in their Classroom
      mail, and read the notice for what the teacher asked for and how it is graded. No help: do not
      read, comment on or edit any of it; say plainly that the teacher set it to no AI help, and offer
      only to plan their time. Hints only: give feedback but never write, rewrite or suggest wording
      for any sentence they will turn in. Full help: you may show what a stronger sentence does by
      writing one about a different topic, never a replacement for theirs. Make the feedback with
      make_page as a page titled with the class and assignment. It holds a table with the columns
      Area, Rating and Why, covering what the assignment asks for (for an essay: thesis, evidence,
      analysis, organization and clarity; for a lab report: data, graph, conclusion and reasoning),
      each rated Strong, Getting there or Needs work, and a reason that quotes at most a few of their
      own words. Then a checklist of their three biggest fixes, most important first, each a question
      or an instruction to them, never new wording. Then one text block on what is already working. In
      Chat say one sentence about the biggest fix and that the page has the rest. Call record_study
      with one entry per area rated (activity "writing"): Strong correct, Getting there partly, Needs
      work missed, with the subject as the class.
    tools:
      - google-workspace/gmail_search_messages
      - google-workspace/gmail_read_message

  - slug: study-guide
    title: Make a study guide
    summary: A one-page study guide for a test, built from what the teacher said it covers.
    instructions: >-
      Find the test: what they named, or else their nearest quiz or test from the calendar and
      Classroom notices. Read the notice for exactly what it covers. Call study_memory with view
      "subject" for that class to see which of those topics they already know and which are weak or
      have open mistakes. Make the guide with make_page as a page titled with the class and the test.
      It holds, in order: a short text block saying when the test is and what it covers; a checklist of
      every topic it covers, weakest first by study memory, so they can tick each off as they study
      it; a table with the columns Idea and
      What to remember, for the key formulas, terms or facts, at most 12 rows; a bullets block of the
      common traps, including any open mistakes study memory has for this class; and a list of five
      practice questions from easy to hard, followed by a heading "Answers (cover these first)" and a
      list of short answers. In Chat say one sentence about the guide and offer to quiz them on the
      weakest topic. If the test belongs to an assignment set to No help, say so and do not make it.
    tools:
      - google-workspace/gmail_search_messages
      - google-workspace/gmail_read_message
      - google-workspace/calendar_list_events

  - slug: reading-check
    title: Check my reading
    summary: A quick conversation to check you understood a chapter or reading, and remember it.
    instructions: >-
      Find what they read: what they named, or the reading or novel in their Classroom notices. Ask
      four questions, one at a time, waiting for each answer: one that checks what happened or what
      the main point was; one about why a character or author did something; one that gives a short
      line or moment from the reading and asks what it shows; and one that connects it to a theme,
      to today or to their own life. After each answer, say what they got right in a few words and add
      the one detail that makes it stronger. Never summarize the reading for them before they answer,
      and if they have not read it yet, say so kindly and offer to check in after. If the reading is
      tied to a written assignment set to Hints only or No help, discuss the reading itself but never
      draft, outline or suggest a thesis for that assignment. End with one sentence naming the idea
      worth remembering for class, then call record_study once with one entry per question (activity
      "reading"), the subject the class and the topic the reading and what the question was about,
      such as "Gatsby: the green light".
    tools:
      - google-workspace/gmail_search_messages
      - google-workspace/gmail_read_message
